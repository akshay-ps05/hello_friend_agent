[project]
name = "hello-friend"
version = "0.1.0"
description = "Hello Friend — personal AI agent built with LangChain and LangGraph"
requires-python = ">=3.11"

dependencies = [
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-groq>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langchain-nvidia-ai-endpoints>=1.0,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "numexpr>=2.10,<3.0",
    "rich>=13.7,<15.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"